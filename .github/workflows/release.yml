name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$version" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Get release notes from CHANGELOG.md
        run: |
          awk -v v="**$VERSION**" '$0 == v { f = 1; next } /^\*\*/ { f = 0 } f && NF' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No CHANGELOG.md entry for $VERSION"
            exit 1
          fi

      - name: Build the starter kit zip
        run: |
          mkdir gvp_v4_starter_kit
          cp starter-kit/* gvp_v4_starter_kit/
          zip -rX gvp_v4_starter_kit.zip gvp_v4_starter_kit

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" gvp_v4_starter_kit.zip \
            --verify-tag --latest \
            --title "GVP$VERSION" \
            --notes-file notes.md
